---
type: showroom

# Set the left column width to 40%
default_width: 40
# Persist the URL state so browser refresh doesn't reset the UI
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  # OCP Console
  - name: OCP Console
    url: 'https://console-openshift-console.${DOMAIN}'

  # Stacked terminals
  - name: Terminal
    path: /terminal
    port: 443
    secondary_name: Terminal
    secondary_path: /terminal
    secondary_port: 443

  # Kafka Console
  # - name: Kafka Console
  #   url: 'https://console-kafka-console.${DOMAIN}'

  # External page
  - name: Red Hat Documentation
    url: 'https://docs.redhat.com/en/documentation'
